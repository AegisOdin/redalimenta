# Instancias temporales (emptyDir) para la prueba de restauración aislada.
apiVersion: v1
kind: Service
metadata: {name: pg-restaurado}
spec:
  clusterIP: None
  selector: {app: pg-restaurado}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: pg-restaurado}
spec:
  serviceName: pg-restaurado
  replicas: 1
  selector: {matchLabels: {app: pg-restaurado}}
  template:
    metadata: {labels: {app: pg-restaurado, rol: restauracion-bd}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:18.6-bookworm
          env:
            - {name: POSTGRES_DB, value: redalimenta}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          envFrom: [{secretRef: {name: restauracion}}]
          readinessProbe: {exec: {command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"]}, periodSeconds: 3}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: d, mountPath: /var/lib/postgresql/data}, {name: run, mountPath: /var/run/postgresql}]
      volumes: [{name: d, emptyDir: {}}, {name: run, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: mongo-restaurado}
spec:
  clusterIP: None
  selector: {app: mongo-restaurado}
  ports: [{port: 27017}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mongo-restaurado}
spec:
  serviceName: mongo-restaurado
  replicas: 1
  selector: {matchLabels: {app: mongo-restaurado}}
  template:
    metadata: {labels: {app: mongo-restaurado, rol: restauracion-bd}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mongo
          image: mongo:9.0.4
          args: ["--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          envFrom: [{secretRef: {name: restauracion}}]
          readinessProbe: {exec: {command: ["mongosh", "--quiet", "--norc", "--eval", "db.adminCommand('ping').ok"]}, periodSeconds: 3, timeoutSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: d, mountPath: /data/db}, {name: c, mountPath: /data/configdb}]
      volumes: [{name: d, emptyDir: {}}, {name: c, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend-restaurado}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend-restaurado}}
  template:
    metadata: {labels: {app: backend-restaurado}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: backend
          image: IMAGEN_BACKEND
          env: [{name: APP_ENV, value: restauracion}, {name: COOKIE_SECURE, value: "false"}]
          envFrom: [{secretRef: {name: restauracion}}]
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, periodSeconds: 3}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
