# Política de auditoría del API server: metadatos de Secrets (sin contenido) y cambios en recursos.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: ["RequestReceived"]
rules:
  - level: None
    users: ["system:kube-proxy"]
  - level: None
    resources: [{group: "", resources: ["events"]}, {group: "coordination.k8s.io", resources: ["leases"]}]
  - level: Metadata
    resources: [{group: "", resources: ["secrets", "configmaps", "serviceaccounts/token"]}]
  - level: Metadata
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
  - level: None
