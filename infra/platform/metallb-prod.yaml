# Rango de IP externas del ambiente prod (dentro de la red Docker del clúster, fuera del rango DHCP de Docker)
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: pool-prod
  namespace: metallb-system
spec:
  addresses: ["172.31.0.200-172.31.0.210"]
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-prod
  namespace: metallb-system
spec:
  ipAddressPools: ["pool-prod"]
