# Nginx no root (puerto 8080). Solo sirve la SPA; /api lo enruta el Gateway directamente al backend.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; include /etc/nginx/snippets/security-headers.conf; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; }
}
