# Producción de laboratorio: 2 réplicas mínimas, HPA 2-6, distribución entre workers, PDB,
# TLS hacia las bases con verificación de CA, exporters y reglas de alerta.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: redalimenta
resources:
  - ../../base
  - ambiente.yaml
  - hpa-pdb.yaml
  - tls-datos.yaml
  - exporters.yaml
  - monitoreo.yaml
configMapGenerator:
  - name: app-config
    behavior: merge
    literals: [APP_ENV=prod, DIAG_REPLICA=false, DB_POOL_SIZE=5, DB_MAX_OVERFLOW=5]
replacements:
  - source: {kind: ConfigMap, name: ambiente, fieldPath: data.HOSTNAME}
    targets:
      - select: {kind: Certificate, name: redalimenta-tls}
        fieldPaths: [spec.dnsNames.0]
      - select: {kind: Gateway}
        fieldPaths: [spec.listeners.0.hostname, spec.listeners.1.hostname]
      - select: {kind: HTTPRoute}
        fieldPaths: [spec.hostnames.0]
patches:
  - path: patch-replicas-distribucion.yaml
  - path: patch-postgres-tls.yaml
  - path: patch-mongo-tls.yaml
  - path: patch-postgres-hba.yaml
  - path: patch-ca-montajes.yaml
  - target: {kind: StatefulSet}
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
images:
  - name: k3d-ra-registry.localhost:5050/redalimenta-backend
    digest: sha256:13d91cdcca00ed947eded6907139e11b76f144bced1204dd4f9367c5286e0873
  - name: k3d-ra-registry.localhost:5050/redalimenta-frontend
    digest: sha256:c72adbd58e1613b128825aece21643592a19c7e996e54dd0a9dd904fdfad0365
