# Producción exige TLS: conexiones sin cifrar desde la red se rechazan
apiVersion: v1
kind: ConfigMap
metadata: {name: postgres-init}
data:
  pg_hba.conf: |
    local     all   all                 trust
    hostssl   all   all   0.0.0.0/0     scram-sha-256
    host      all   all   0.0.0.0/0     reject
