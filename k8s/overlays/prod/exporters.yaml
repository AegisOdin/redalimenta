# Exporters con cuentas de monitorización de mínimo privilegio (pg_monitor / clusterMonitor)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  labels: {app.kubernetes.io/name: postgres-exporter}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres-exporter}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres-exporter}
    spec:
      serviceAccountName: exporters
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: exporter
          image: prometheuscommunity/postgres-exporter:v0.20.1
          ports: [{name: metrics, containerPort: 9187}]
          envFrom: [{secretRef: {name: exporter-postgres}}]
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: ca, mountPath: /etc/redalimenta-ca, readOnly: true}]
      volumes: [{name: ca, configMap: {name: ca-laboratorio}}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  labels: {app.kubernetes.io/name: postgres-exporter}
spec:
  selector: {app.kubernetes.io/name: postgres-exporter}
  ports: [{name: metrics, port: 9187, targetPort: metrics}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  labels: {app.kubernetes.io/name: mongodb-exporter}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: mongodb-exporter}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mongodb-exporter}
    spec:
      serviceAccountName: exporters
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: exporter
          image: percona/mongodb_exporter:0.54.0
          args: ["--collect-all", "--compatible-mode", "--web.listen-address=:9216"]
          ports: [{name: metrics, containerPort: 9216}]
          envFrom: [{secretRef: {name: exporter-mongo}}]
          resources: {requests: {cpu: 20m, memory: 48Mi}, limits: {memory: 192Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: ca, mountPath: /etc/redalimenta-ca, readOnly: true}]
      volumes: [{name: ca, configMap: {name: ca-laboratorio}}]
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-exporter
  labels: {app.kubernetes.io/name: mongodb-exporter}
spec:
  selector: {app.kubernetes.io/name: mongodb-exporter}
  ports: [{name: metrics, port: 9216, targetPort: metrics}]
