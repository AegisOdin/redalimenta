# Job único de migraciones + índices MongoDB + semilla idempotente (nunca en cada réplica de la app).
apiVersion: batch/v1
kind: Job
metadata:
  name: migraciones
  labels: {app.kubernetes.io/name: migraciones}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: migraciones, rol: migraciones}
    spec:
      serviceAccountName: migraciones
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrar
          image: backend
          # espera a que los motores acepten conexiones (primer arranque) y luego migra una sola vez
          command: ["sh", "-c", "for i in $(seq 60); do alembic upgrade head && break; echo 'esperando BD'; sleep 5; done && python -m app.mongo_init && DATABASE_URL=$SEED_DATABASE_URL python -m app.seed"]
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: migraciones-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tarea-diaria
spec:
  schedule: "15 6 * * *"         # caducidades y despensas no recogidas
  timeZone: America/Mexico_City
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {app.kubernetes.io/name: tarea-diaria, rol: tareas}
        spec:
          serviceAccountName: tareas
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: tarea
              image: backend
              command: ["python", "-m", "app.tasks", "diario"]
              envFrom:
                - configMapRef: {name: app-config}
                - secretRef: {name: backend-secrets}
              resources:
                requests: {cpu: 50m, memory: 96Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
