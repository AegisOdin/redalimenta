# RBAC por función humana (grupos del certificado de cliente, campo O=). Ver matriz en D06.
# Lectura sin Secrets para auditoría y soporte
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: lector}
rules:
  - apiGroups: ["", "apps", "batch", "autoscaling", "policy", "networking.k8s.io", "gateway.networking.k8s.io"]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "persistentvolumeclaims", "events",
                "deployments", "replicasets", "statefulsets", "jobs", "cronjobs", "horizontalpodautoscalers",
                "poddisruptionbudgets", "networkpolicies", "httproutes", "gateways"]
    verbs: ["get", "list", "watch"]
---
# Operador: lectura + operación de cargas (reinicio, escala, rollback, lanzar respaldo). Sin Secrets ni exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: operador}
rules:
  - apiGroups: ["", "apps", "batch", "autoscaling", "policy", "networking.k8s.io", "gateway.networking.k8s.io"]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "persistentvolumeclaims", "events",
                "deployments", "replicasets", "statefulsets", "jobs", "cronjobs", "horizontalpodautoscalers",
                "poddisruptionbudgets", "networkpolicies", "httproutes", "gateways"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "statefulsets/scale"]
    verbs: ["patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
# Desplegador (pipeline): aplica manifiestos de la app. No lee Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: desplegador}
rules:
  - apiGroups: ["", "apps", "batch", "autoscaling", "policy", "networking.k8s.io", "gateway.networking.k8s.io", "cert-manager.io", "monitoring.coreos.com"]
    resources: ["services", "configmaps", "persistentvolumeclaims", "deployments", "statefulsets", "jobs", "cronjobs",
                "horizontalpodautoscalers", "poddisruptionbudgets", "networkpolicies", "httproutes", "gateways",
                "certificates", "servicemonitors", "podmonitors", "prometheusrules", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: lectores}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: lector}
subjects: [{kind: Group, name: redalimenta:lectores, apiGroup: rbac.authorization.k8s.io}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: operadores}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: operador}
subjects: [{kind: Group, name: redalimenta:operadores, apiGroup: rbac.authorization.k8s.io}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: desplegadores}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: desplegador}
subjects: [{kind: Group, name: redalimenta:desplegadores, apiGroup: rbac.authorization.k8s.io}]
