# Respaldo diario consistente de ambos motores hacia un volumen distinto al de los datos, cifrado con AES-256.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: respaldos}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: respaldo-scripts}
data:
  postgres.sh: |
    #!/bin/bash
    # pg_dump usa una instantánea transaccional => respaldo consistente aunque haya escrituras
    set -euo pipefail; umask 077
    D=/respaldos/$(date -u +%Y%m%dT%H%M%SZ); mkdir -p "$D"; echo "$D" > /respaldos/.en-curso
    T0=$(date +%s)
    pg_dump -h postgres -U redalimenta_backup -d redalimenta -Fc -Z 6 \
      | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_ENCRYPTION_KEY -out "$D/postgres.dump.enc"
    T1=$(date +%s)
    ( cd "$D" && sha256sum postgres.dump.enc > postgres.sha256 )
    # conteos de referencia para verificar la restauración
    psql -h postgres -U redalimenta_backup -d redalimenta -tAc "select json_object_agg(t, n) from (
      select 'usuarios' t, count(*) n from usuarios union all select 'donantes', count(*) from donantes union all
      select 'productos', count(*) from productos union all select 'lotes', count(*) from lotes union all
      select 'hogares', count(*) from hogares union all select 'despensas', count(*) from despensas union all
      select 'despensa_detalle', count(*) from despensa_detalle union all select 'outbox', count(*) from outbox) x" > "$D/postgres-conteos.json"
    echo "{\"motor\":\"postgres\",\"inicio\":$T0,\"fin\":$T1,\"segundos\":$((T1-T0)),\"bytes\":$(stat -c %s "$D/postgres.dump.enc")}" > "$D/postgres.json"
    cat "$D/postgres.json"
  mongo.sh: |
    #!/bin/bash
    # Instancia standalone: mongodump sin --oplog. La consistencia entre colecciones se garantiza
    # reproyectando desde el outbox de PostgreSQL los eventos posteriores al respaldo (ver D09).
    set -euo pipefail; umask 077
    D=$(cat /respaldos/.en-curso)
    T0=$(date +%s)
    mongodump --uri="$MONGO_BACKUP_URI" --db=redalimenta --archive --gzip --quiet \
      | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_ENCRYPTION_KEY -out "$D/mongo.archive.enc"
    T1=$(date +%s)
    ( cd "$D" && sha256sum mongo.archive.enc > mongo.sha256 )
    mongosh "$MONGO_BACKUP_URI" --quiet --norc --eval 'const d=db.getSiblingDB("redalimenta"); print(JSON.stringify({expediente_lote: d.expediente_lote.countDocuments(), bitacora_eventos: d.bitacora_eventos.countDocuments()}))' > "$D/mongo-conteos.json"
    echo "{\"motor\":\"mongo\",\"inicio\":$T0,\"fin\":$T1,\"segundos\":$((T1-T0)),\"bytes\":$(stat -c %s "$D/mongo.archive.enc")}" > "$D/mongo.json"
    cat "$D/mongo.json"
    # verificación de integridad inmediata y retención
    ( cd "$D" && sha256sum -c postgres.sha256 mongo.sha256 )
    find /respaldos -mindepth 1 -maxdepth 1 -type d -mtime +"${RETENCION_DIAS:-7}" -print -exec rm -rf {} +
    rm -f /respaldos/.en-curso; date -u +%s > /respaldos/ultimo-exitoso
    ls -la "$D"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: respaldo
spec:
  schedule: "0 2 * * *"           # RPO objetivo 24 h
  timeZone: America/Mexico_City
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: {app.kubernetes.io/name: respaldo, rol: respaldos}
        spec:
          serviceAccountName: respaldos
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: postgres
              image: postgres:18.6-bookworm
              command: ["/bin/bash", "/scripts/postgres.sh"]
              envFrom: [{secretRef: {name: respaldo-secrets}}]
              resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
              volumeMounts: [{name: respaldos, mountPath: /respaldos}, {name: scripts, mountPath: /scripts}, {name: tmp, mountPath: /tmp}]
          containers:
            - name: mongo
              image: mongo:9.0.4
              command: ["/bin/bash", "/scripts/mongo.sh"]
              envFrom: [{secretRef: {name: respaldo-secrets}}]
              env: [{name: RETENCION_DIAS, value: "7"}]
              resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
              volumeMounts: [{name: respaldos, mountPath: /respaldos}, {name: scripts, mountPath: /scripts}, {name: tmp, mountPath: /tmp}]
          volumes:
            - {name: respaldos, persistentVolumeClaim: {claimName: respaldos}}
            - {name: scripts, configMap: {name: respaldo-scripts, defaultMode: 0555}}
            - {name: tmp, emptyDir: {}}
