apiVersion: v1
kind: ConfigMap
metadata: {name: app-config}
data:
  APP_ENV: dev
  COOKIE_SECURE: "true"
  SESSION_MINUTES: "30"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  DIAG_REPLICA: "false"
  MONGO_DB: redalimenta
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {app.kubernetes.io/name: backend}
spec:
  selector: {app.kubernetes.io/name: backend}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: {app.kubernetes.io/name: backend, app.kubernetes.io/part-of: redalimenta}
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: backend, app.kubernetes.io/part-of: redalimenta, rol: api}
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: backend
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: backend-secrets}
          resources:
            requests: {cpu: 250m, memory: 192Mi}
            limits: {memory: 512Mi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:            # no depende de BD: evita reinicios masivos si cae PostgreSQL
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          lifecycle:                # deja que Traefik retire el endpoint antes de apagar (evita 502 en rolling update)
            preStop: {sleep: {seconds: 5}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      terminationGracePeriodSeconds: 30
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox
  labels: {app.kubernetes.io/name: outbox, app.kubernetes.io/part-of: redalimenta}
spec:
  replicas: 1                # SKIP LOCKED permite más réplicas, pero una basta y conserva el orden
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: outbox}
  template:
    metadata:
      labels: {app.kubernetes.io/name: outbox, app.kubernetes.io/part-of: redalimenta, rol: worker}
    spec:
      serviceAccountName: outbox
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: outbox
          image: backend
          command: ["python", "-m", "app.outbox"]
          ports: [{name: metrics, containerPort: 9100}]
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: backend-secrets}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: outbox-metrics
  labels: {app.kubernetes.io/name: outbox}
spec:
  selector: {app.kubernetes.io/name: outbox}
  ports: [{name: metrics, port: 9100, targetPort: metrics}]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: frontend}
spec:
  selector: {app.kubernetes.io/name: frontend}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: redalimenta}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: redalimenta, rol: web}
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: frontend
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          startupProbe:             # Nginx arranca en < 1 s; da hasta 30 s antes de evaluar las otras sondas
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop: {sleep: {seconds: 5}}
          volumeMounts:
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: cache, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
