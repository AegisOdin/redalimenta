apiVersion: v1
kind: ConfigMap
metadata: {name: mongo-init}
data:
  10-cuentas.js: |
    // Solo en la primera inicialización. Mínimo privilegio por función.
    const e = process.env;
    const adm = db.getSiblingDB("admin");
    const app = db.getSiblingDB("redalimenta");
    app.createUser({user: "redalimenta_app", pwd: e.APP_PASSWORD, roles: [{role: "readWrite", db: "redalimenta"}]});
    app.createUser({user: "redalimenta_migrator", pwd: e.MIGRATOR_PASSWORD,
                    roles: [{role: "readWrite", db: "redalimenta"}, {role: "dbAdmin", db: "redalimenta"}]});
    adm.createUser({user: "redalimenta_backup", pwd: e.BACKUP_PASSWORD, roles: [{role: "backup", db: "admin"}]});
    adm.createUser({user: "redalimenta_exporter", pwd: e.EXPORTER_PASSWORD,
                    roles: [{role: "clusterMonitor", db: "admin"}, {role: "read", db: "local"}]});
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels: {app.kubernetes.io/name: mongo}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: mongo}
  ports: [{name: mongo, port: 27017, targetPort: 27017}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels: {app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: redalimenta}
spec:
  serviceName: mongo
  replicas: 1                # replica set de 3 miembros diseñado como ampliación (D04)
  selector:
    matchLabels: {app.kubernetes.io/name: mongo}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: redalimenta, rol: datos}
    spec:
      serviceAccountName: mongo
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mongo
          image: mongo:9.0.4
          args: ["--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          ports: [{name: mongo, containerPort: 27017}]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: {secretKeyRef: {name: mongo-root, key: MONGO_INITDB_ROOT_USERNAME}}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mongo-root, key: MONGO_INITDB_ROOT_PASSWORD}}
          envFrom:
            - secretRef: {name: mongo-cuentas}
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 1Gi}
          startupProbe:
            exec: {command: ["mongosh", "--quiet", "--norc", "--eval", "db.adminCommand('ping').ok"]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: ["mongosh", "--quiet", "--norc", "--eval", "db.adminCommand('ping').ok"]}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: 27017}
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: datos, mountPath: /data/db}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
            - {name: tmp, mountPath: /tmp}
            - {name: configdb, mountPath: /data/configdb}
      volumes:
        - name: init
          configMap: {name: mongo-init}
        - {name: tmp, emptyDir: {}}
        - {name: configdb, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: datos}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources: {requests: {storage: 2Gi}}
