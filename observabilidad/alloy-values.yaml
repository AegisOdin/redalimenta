# Grafana Alloy como DaemonSet: recolecta logs de todos los Pods y los envía a Loki
controller: {type: daemonset}
alloy:
  mounts: {varlog: true}
  resources: {requests: {cpu: 30m, memory: 96Mi}, limits: {memory: 384Mi}}
  extraEnv:
    - name: NODE_NAME
      valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          action        = "keep"
          regex         = sys.env("NODE_NAME")
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.json.receiver]
      }
      loki.process "json" {
        stage.json {
          expressions = { level = "level", request_id = "request_id" }
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.default.receiver]
      }
      // Eventos de Kubernetes del namespace de la app (Pending, reinicios, desalojos, escalado del HPA).
      // Cada réplica de Alloy los lee; Loki descarta las líneas idénticas (misma marca de tiempo y etiquetas).
      loki.source.kubernetes_events "eventos" {
        namespaces = ["redalimenta"]
        job_name   = "eventos-kubernetes"
        forward_to = [loki.write.default.receiver]
      }
      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }
